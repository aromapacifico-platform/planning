<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- ISOTIPO UNA TINTA (x=20, y=15, w=90, h=90) -->
  <g id="isotipo-una-tinta" transform="translate(20, 15)">
    <!-- Contenedor perimetral de alto contraste para impresion termica -->
    <circle cx="45" cy="45" r="43" fill="none" stroke="#000000" stroke-width="2.5"/>
    
    <!-- Lobo Izquierdo: Follaje / Montana -->
    <path d="M 43,14 C 26,14 15,28 15,45 C 15,62 26,76 43,76 C 41,66 38,55 38,45 C 38,34 41,24 43,14 Z" 
          fill="#000000"/>
    
    <!-- Lobo Derecho Superior: Fruto -->
    <path d="M 47,14 C 54,23 58,33 58,43 C 58,45 58,47 58,49 C 68,46 75,37 75,28 C 75,19 63,14 47,14 Z" 
          fill="#000000"/>

    <!-- Lobo Derecho Inferior: Ruta Pacifico -->
    <path d="M 58,52 C 57,61 53,70 47,76 C 63,76 75,66 75,52 C 75,47 70,49 58,52 Z" 
          fill="#000000"/>

    <!-- Surco Central S-Curve: Blanco puro para calar en negro -->
    <path d="M 44,15 Q 48,32 39,45 Q 31,58 45,75" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- LOGOTIPO / TIPOGRAFIA UNA TINTA (x=130) -->
  <g id="logotipo-una-tinta" transform="translate(130, 24)">
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="42" font-weight="800" fill="#000000" letter-spacing="-0.5">AromaPacífico</text>
    
    <rect x="0" y="56" width="360" height="3" fill="#000000"/>

    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13" font-weight="700" fill="#000000" letter-spacing="1.5">FEDERACIÓN NACIONAL DE CAFETEROS · FNC 2026</text>
  </g>
</svg>
