<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo Oscuro para version negativa -->
  <rect width="100" height="100" rx="16" fill="#0F172A"/>

  <!-- Circulo contenedor perimetral blanco -->
  <circle cx="50" cy="50" r="44" fill="#1E293B" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Lobo Izquierdo: Blanco -->
  <path d="M 48,15 C 29,15 17,31 17,50 C 17,69 29,85 48,85 C 46,74 42,61 42,50 C 42,38 46,26 48,15 Z" 
        fill="#FFFFFF"/>
  
  <!-- Lobo Derecho Superior: Blanco -->
  <path d="M 52,15 C 60,25 64,36 64,48 C 64,50 64,52 64,54 C 75,51 83,41 83,31 C 83,21 70,15 52,15 Z" 
        fill="#FFFFFF"/>

  <!-- Lobo Derecho Inferior: Blanco -->
  <path d="M 64,57 C 63,67 59,77 52,85 C 70,85 83,73 83,57 C 83,52 77,54 64,57 Z" 
        fill="#FFFFFF"/>

  <!-- Surco Central S-Curve: Calado en color de fondo -->
  <path d="M 49,16 Q 53,35 43,50 Q 34,65 50,84" 
        fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
</svg>
