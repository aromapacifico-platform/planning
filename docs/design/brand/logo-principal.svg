<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-verde-lp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#135E34"/>
    </linearGradient>
    <linearGradient id="grad-azul-lp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="grad-cereza-lp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#9E1B1B"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO (Coordenadas x=20, y=15, w=90, h=90) -->
  <g id="isotipo" transform="translate(20, 15)">
    <!-- Contenedor circular suave -->
    <circle cx="45" cy="45" r="43" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2"/>
    
    <!-- Geometria refinada del grano de cafe (fissura natural en espacio negativo) -->
    <g transform="translate(45, 45) scale(0.88) translate(-50, -50)">
      <!-- Lobo Izquierdo: Verde Cordillera -->
      <path d="M 47.5,14 C 29,14 17,29 17,50 C 17,71 29,86 47.5,86 C 42,72 43,60 46.5,50 C 50,40 51,28 47.5,14 Z" 
            fill="url(#grad-verde-lp)"/>
      <!-- Lobo Derecho Superior: Rojo Cereza -->
      <path d="M 52.5,14 C 56,28 55,40 51.5,47 C 64,45 76,40 81,30 C 78,19 68,14 52.5,14 Z" 
            fill="url(#grad-cereza-lp)"/>
      <!-- Lobo Derecho Inferior: Azul Pacifico -->
      <path d="M 51.5,53 C 48,60 47,72 52.5,86 C 68,86 83,73 83,52 C 75,51 63,52 51.5,53 Z" 
            fill="url(#grad-azul-lp)"/>
    </g>
  </g>

  <!-- LOGOTIPO / TIPOGRAFIA (x=130) -->
  <g id="logotipo" transform="translate(130, 24)">
    <!-- AromaPacífico (Carbón y Verde Institucional) -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Aroma<tspan fill="#135E34">Pacífico</tspan></text>
    
    <!-- Filete institucional tricolor -->
    <rect x="0" y="56" width="360" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="0" y="56" width="120" height="3" rx="1.5" fill="#135E34"/>
    <rect x="120" y="56" width="70" height="3" rx="1.5" fill="#0F4C81"/>
    <rect x="190" y="56" width="40" height="3" rx="1.5" fill="#9E1B1B"/>

    <!-- Subtitulo Institucional FNC 2026 -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">FEDERACIÓN NACIONAL DE CAFETEROS · FNC 2026</text>
  </g>
</svg>
