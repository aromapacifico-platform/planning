<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-verde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#135E34"/>
    </linearGradient>
    <linearGradient id="grad-azul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="grad-cereza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#9E1B1B"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO (Coordenadas x=20, y=15, w=90, h=90) -->
  <g id="isotipo" transform="translate(20, 15)">
    <!-- Circulo contenedor sutil para contraste -->
    <circle cx="45" cy="45" r="43" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2"/>
    
    <!-- Lobo Izquierdo: Montanas Andinas y Follaje Cafetero -->
    <path d="M 43,14 C 26,14 15,28 15,45 C 15,62 26,76 43,76 C 41,66 38,55 38,45 C 38,34 41,24 43,14 Z" 
          fill="url(#grad-verde)"/>
    
    <!-- Lobo Derecho Superior: Cereza de Cafe y Maduracion -->
    <path d="M 47,14 C 54,23 58,33 58,43 C 58,45 58,47 58,49 C 68,46 75,37 75,28 C 75,19 63,14 47,14 Z" 
          fill="url(#grad-cereza)"/>

    <!-- Lobo Derecho Inferior: Ruta Pacifico Maritima (Oceano y Exportacion) -->
    <path d="M 58,52 C 57,61 53,70 47,76 C 63,76 75,66 75,52 C 75,47 70,49 58,52 Z" 
          fill="url(#grad-azul)"/>

    <!-- Surco Central S-Curve: Rio / Viento Andino / Surco del Grano -->
    <path d="M 44,15 Q 48,32 39,45 Q 31,58 45,75" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- LOGOTIPO / TIPOGRAFIA (x=130) -->
  <g id="logotipo" transform="translate(130, 24)">
    <!-- Aroma (Slate oscuro de alta legibilidad) -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Aroma<tspan fill="#135E34">Pacífico</tspan></text>
    
    <!-- Filete decorativo de horizonte cafetero -->
    <rect x="0" y="56" width="360" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="0" y="56" width="120" height="3" rx="1.5" fill="#135E34"/>
    <rect x="120" y="56" width="70" height="3" rx="1.5" fill="#0F4C81"/>
    <rect x="190" y="56" width="40" height="3" rx="1.5" fill="#9E1B1B"/>

    <!-- Subtitulo Institucional FNC 2026 -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">FEDERACIÓN NACIONAL DE CAFETEROS · FNC 2026</text>
  </g>
</svg>
