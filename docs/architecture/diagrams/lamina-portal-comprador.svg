 class="mono" font-size="21" font-weight="800" fill="#0F172A">SACO-2026-CAU-7F3A9C12</text><rect x="552" y="224" width="156" height="36" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><g transform="translate(562,232) scale(0.833)"><path d="M12 2L4 5.5V11.5C4 16.8 7.5 21 12 22.5C16.5 21 20 16.8 20 11.5V5.5Z" fill="#16A34A"/><path d="M8.5 12.2L10.8 14.6L15.8 9.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="590" y="247" font-size="13.5" font-weight="800" fill="#14532D">ACEPTADO</text><line x1="50" y1="274" x2="710" y2="274" stroke="#CBD5E1"/><text x="50" y="302" font-size="12" font-weight="700" fill="#64748B">ORIGEN</text><text x="50" y="324" font-size="15.5" font-weight="800" fill="#0F172A">Cauca · Popayán</text><text x="270" y="302" font-size="12" font-weight="700" fill="#64748B">VARIEDAD / SCA</text><text x="270" y="324" font-size="15.5" font-weight="800" fill="#135E34">Castillo · 86.5 pts</text><text x="490" y="302" font-size="12" font-weight="700" fill="#64748B">MASA ESTÁNDAR</text><text x="490" y="324" class="mono" font-size="15.5" font-weight="800" fill="#0F172A">60.0 kg</text><text x="50" y="366" font-size="12" font-weight="700" fill="#64748B">SECADO REGISTRADO</text><text x="50" y="388" class="mono" font-size="15" font-weight="700" fill="#0F172A">11.8 % · 21 °C</text><text x="270" y="366" font-size="12" font-weight="700" fill="#64748B">COSECHA / ENTREGA</text><text x="270" y="388" class="mono" font-size="14" font-weight="700" fill="#0F172A">05 Nov -&gt; 10 Nov 2026</text><text x="490" y="366" font-size="12" font-weight="700" fill="#64748B">PUERTO SALIDA</text><text x="490" y="388" font-size="15" font-weight="800" fill="#0F4C81">Buenaventura</text><rect x="50" y="406" width="290" height="34" rx="6" fill="#0F4C81"/><text x="195" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Descargar Certificado SCA (PDF)</text><rect x="28" y="472" width="704" height="176" rx="12" fill="#FEF2F2" stroke="#9E1B1B" stroke-width="1.8" stroke-dasharray="6,4"/><text x="50" y="502" font-size="14" font-weight="800" fill="#9E1B1B">PROTECCIÓN DE DATOS PERSONALES · LEY 1581 DE 2012</text><text x="50" y="532" font-size="13" font-weight="700" fill="#7F1D1D">Campos excluidos físicamente de la tabla pública sacos_publicos:</text><text x="50" y="560" font-size="13" fill="#7F1D1D">- Cédula y nombre completo del caficultor (token HMAC-SHA-256 irreversible).</text><text x="50" y="586" font-size="13" fill="#7F1D1D">- Coordenadas GPS submétricas de la finca y polígonos de vuelo.</text><text x="50" y="612" font-size="13" fill="#7F1D1D">- Identidad del transportador y georrutas intermedias de transporte.</text><text x="50" y="636" font-size="12" font-weight="700" fill="#135E34">Auditoría inmutable: toda lectura queda registrada 5 años en S3 Object Lock Compliance.</text></g>
<g filter="url(#card-sh)"><rect x="836" y="134" width="724" height="120" rx="12" fill="#FFFFFF" stroke="#9E1B1B" stroke-width="1.8"/><rect x="836" y="134" width="8" height="120" rx="4" fill="#9E1B1B"/><rect x="860" y="150" width="160" height="24" rx="12" fill="#9E1B1B"/><text x="870" y="166" font-size="12" font-weight="700" fill="#FFFFFF">LEY 1581 DE 2012</text><text x="860" y="202" font-size="16" font-weight="800" fill="#0F172A">Tabla Disjunta sacos_publicos (0 PII)</text><text x="860" y="228" font-size="13.5" fill="#334155">Físicamente aislada de sacos_eventos: nunca expone cédula, nombre del caficultor, finca ni georrutas.</text></g>
