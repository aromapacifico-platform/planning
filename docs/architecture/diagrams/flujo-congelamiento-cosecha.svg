<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 950" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #232F3E; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #5A6B7C; text-anchor: middle; }
      .header-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #232F3E; }
      .bold-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-style: italic; fill: #5A6B7C; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D76DB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C62828" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#545B64" />
    </marker>
  </defs>

  <rect width="1750" height="950" fill="#F8F9FA" />

  <!-- TITULO Y SUBTITULO -->
  <text x="875" y="40" class="title">AromaPacifico - Compuerta de Congelamiento de Cosecha y Flujo CI/CD de Produccion</text>
  <text x="875" y="68" class="subtitle">Validacion de Ventana Horaria (05:00 a 18:00 COT), Bloqueo Automatizado del Pipeline y Auditoria de Ejemplos #32 y #33</text>

  <!-- SECCION 1: PIPELINE PREVIO -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="320" height="520" rx="8" fill="#FFFFFF" stroke="#1D76DB" stroke-width="2" />
    <rect width="320" height="36" rx="8" fill="#EBF3FB" />
    <text x="15" y="24" class="header-box" fill="#1D76DB">1. Flujo CI/CD Previo a Produccion</text>

    <!-- Disparador -->
    <rect x="20" y="55" width="280" height="85" rx="6" fill="#F8F9FA" stroke="#545B64" stroke-width="1" />
    <text x="35" y="78" class="bold-text">Disparador de Cambio</text>
    <text x="35" y="98" class="body-text">Push a rama 'main' / Workflow Dispatch</text>
    <text x="35" y="118" class="body-text">Autenticacion OIDC en GitHub Actions</text>

    <!-- Ambientes Bajos -->
    <rect x="20" y="170" width="280" height="110" rx="6" fill="#F4F8FD" stroke="#1D76DB" stroke-width="1" />
    <text x="35" y="195" class="bold-text" fill="#1D76DB">deploy-dev y deploy-test</text>
    <text x="35" y="217" class="body-text">- terraform fmt -check y validate</text>
    <text x="35" y="237" class="body-text">- Analisis estatico tflint y Trivy</text>
    <text x="35" y="257" class="body-text">- 100% exitoso antes de produccion</text>

    <!-- Invocacion Gatekeeper -->
    <rect x="20" y="315" width="280" height="175" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" />
    <text x="35" y="340" class="bold-text" fill="#D93F0B">Job: harvest-window-gate</text>
    <text x="35" y="365" class="body-text">Invocacion de check_harvest_window.py</text>
    <text x="35" y="387" class="body-text">- Zona horaria: America/Bogota (COT)</text>
    <text x="35" y="407" class="body-text">- Meses de Cosecha: (4, 5, 6, 9, 10, 11)</text>
    <text x="35" y="427" class="body-text">- Ventana prohibida: 05:00 a 18:00 COT</text>
    <text x="35" y="447" class="body-text">- Emision a $GITHUB_OUTPUT:</text>
    <text x="35" y="467" class="body-text" font-family="monospace">allowed, blocked, reason</text>

    <!-- Flechas Seccion 1 -->
    <line x1="160" y1="140" x2="160" y2="170" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />
    <line x1="160" y1="280" x2="160" y2="315" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />
  </g>

  <!-- Flecha de Seccion 1 a Seccion 2 -->
  <line x1="360" y1="500" x2="400" y2="500" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- SECCION 2: MOTOR DE DECISION -->
  <g transform="translate(400, 100)" filter="url(#shadow)">
    <rect width="640" height="520" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" />
    <rect width="640" height="36" rx="8" fill="#FFF3E0" />
    <text x="15" y="24" class="header-box" fill="#E65100">2. Motor de Decision de la Politica de Cosecha</text>

    <!-- Rombo Cosecha -->
    <polygon points="150,55 260,115 150,175 40,115" fill="#EAEDED" stroke="#545B64" stroke-width="2" />
    <text x="150" y="108" class="bold-text" text-anchor="middle">¿Temporada de Cosecha?</text>
    <text x="150" y="126" class="body-text" text-anchor="middle">Meses: 4, 5, 6, 9, 10, 11</text>

    <!-- Salida Fuera Cosecha -->
    <rect x="360" y="75" width="250" height="75" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" />
    <text x="375" y="102" class="bold-text" fill="#1B5E20">Fuera de Cosecha: PERMITIDO</text>
    <text x="375" y="122" class="body-text">Cualquier horario autorizado</text>
    <text x="375" y="140" class="bold-text" fill="#2E7D32">Exit Code: 0 (allowed=true)</text>

    <line x1="260" y1="115" x2="360" y2="115" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="295" y="105" class="bold-text" fill="#2E7D32">NO</text>

    <!-- Rombo Horario -->
    <polygon points="150,215 260,275 150,335 40,275" fill="#FFF3E0" stroke="#E65100" stroke-width="2" />
    <text x="150" y="268" class="bold-text" text-anchor="middle">¿Horario Restringido?</text>
    <text x="150" y="286" class="body-text" text-anchor="middle">05:00:00 a 18:00:00 COT</text>

    <line x1="150" y1="175" x2="150" y2="215" stroke="#D84315" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="160" y="200" class="bold-text" fill="#D84315">SI</text>

    <!-- Salida Ventana Nocturna Permitida -->
    <rect x="360" y="235" width="250" height="85" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
    <text x="375" y="262" class="bold-text" fill="#1B5E20">Ventana Nocturna: PERMITIDO</text>
    <text x="375" y="282" class="body-text">18:00:01 a 04:59:59 COT (Valle)</text>
    <text x="375" y="302" class="bold-text" fill="#2E7D32">Exit Code: 0 (Ejemplos #32 y #33)</text>

    <line x1="260" y1="275" x2="360" y2="275" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="280" y="265" class="bold-text" fill="#2E7D32">NO (Noche)</text>

    <!-- Rombo Bypass Emergencia -->
    <polygon points="150,375 260,435 150,495 40,435" fill="#FBE9E7" stroke="#D84315" stroke-width="2" />
    <text x="150" y="428" class="bold-text" text-anchor="middle">¿Excepcion de Incidente?</text>
    <text x="150" y="446" class="body-text" text-anchor="middle">Labels: incident, hotfix</text>

    <line x1="150" y1="335" x2="150" y2="375" stroke="#C62828" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="160" y="360" class="bold-text" fill="#C62828">SI</text>

    <!-- Salida Emergencia -->
    <rect x="360" y="365" width="250" height="65" rx="6" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1" />
    <text x="375" y="388" class="bold-text" fill="#F57F17">Emergencia Autorizada</text>
    <text x="375" y="408" class="body-text">Exit Code: 0 (bypassed=true)</text>

    <line x1="240" y1="415" x2="360" y2="395" stroke="#FBC02D" stroke-width="2" marker-end="url(#arrow-gray)" />
    <text x="270" y="395" class="bold-text" fill="#F57F17">SI</text>

    <!-- Salida Bloqueado -->
    <rect x="360" y="445" width="250" height="65" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2" />
    <text x="375" y="468" class="bold-text" fill="#B71C1C">BLOQUEO TOTAL DEL PIPELINE</text>
    <text x="375" y="488" class="bold-text" fill="#C62828">Exit Code: 1 (Falla el CI/CD)</text>

    <line x1="260" y1="445" x2="360" y2="475" stroke="#C62828" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="270" y="480" class="bold-text" fill="#C62828">NO</text>
  </g>

  <!-- Flecha de Salida Nocturna a Seccion 3 -->
  <line x1="1040" y1="375" x2="1080" y2="375" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- SECCION 3: AUDITORIA DE EJEMPLOS -->
  <g transform="translate(1080, 100)" filter="url(#shadow)">
    <rect width="630" height="520" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" />
    <rect width="630" height="36" rx="8" fill="#E8F5E9" />
    <text x="15" y="24" class="header-box" fill="#1B5E20">3. Auditoria de Ejemplos Oficiales de Release Notes</text>

    <!-- Tarjeta Ejemplo 1 -->
    <rect x="20" y="55" width="590" height="205" rx="6" fill="#F4FBF4" stroke="#2E7D32" stroke-width="2" />
    <text x="35" y="80" class="bold-text" fill="#1B5E20">Ejemplo 1: Release Notes Aplicacion (Issue #32)</text>
    <text x="35" y="102" class="body-text">Identificador: REL-APP-2026-004 | Componente: E6-05 Consulta Publica Saco</text>
    <text x="35" y="124" class="body-text">Fecha Programada: 17 de noviembre de 2026</text>
    <text x="35" y="146" class="bold-text">Ventana Oficial: 20:00 a 21:30 COT (01:00 a 02:30 UTC)</text>
    <text x="35" y="168" class="body-text">Estado Agronomico: Activo (Mes 11, Semana ISO 47, Cosecha Principal)</text>
    <text x="35" y="190" class="body-text">Evaluacion Horaria: 20:00 COT esta 2 horas despues de las 18:00 COT</text>
    <rect x="35" y="205" width="555" height="40" rx="4" fill="#2E7D32" />
    <text x="45" y="230" class="badge-text">VEREDICTO: ALLOWED - CUMPLE FUERA DEL HORARIO PROHIBIDO</text>

    <!-- Tarjeta Ejemplo 2 -->
    <rect x="20" y="285" width="590" height="205" rx="6" fill="#F4FBF4" stroke="#2E7D32" stroke-width="2" />
    <text x="35" y="310" class="bold-text" fill="#1B5E20">Ejemplo 2: Release Notes Infraestructura (Issue #33)</text>
    <text x="35" y="332" class="body-text">Identificador: REL-INFRA-2026-003 | Componente: E6-04 Regla C05 SG VPCE S3</text>
    <text x="35" y="354" class="body-text">Fecha Programada: 18 de noviembre de 2026</text>
    <text x="35" y="376" class="bold-text">Ventana Oficial: 20:00 a 20:45 COT (01:00 a 01:45 UTC)</text>
    <text x="35" y="398" class="body-text">Estado Agronomico: Activo (Mes 11, Semana ISO 47, Cosecha Cauca)</text>
    <text x="35" y="420" class="body-text">Evaluacion Horaria: 20:00 COT esta 2 horas despues de las 18:00 COT</text>
    <rect x="35" y="435" width="555" height="40" rx="4" fill="#2E7D32" />
    <text x="45" y="460" class="badge-text">VEREDICTO: ALLOWED - CUMPLE FUERA DEL HORARIO PROHIBIDO</text>
  </g>

  <!-- SECCION 4: GOBERNANZA CERO APPLY -->
  <g transform="translate(40, 650)" filter="url(#shadow)">
    <rect width="1670" height="260" rx="8" fill="#FFFFFF" stroke="#545B64" stroke-width="2" />
    <rect width="1670" height="36" rx="8" fill="#EAEDED" />
    <text x="15" y="24" class="header-box" fill="#232F3E">4. Gobernanza de Despliegue en Produccion (Alcance Estricto de Cero Apply)</text>

    <!-- Bloque Plan -->
    <rect x="30" y="55" width="370" height="180" rx="6" fill="#F8F9FA" stroke="#545B64" stroke-width="1" />
    <text x="45" y="82" class="bold-text">Etapa: deploy-prod (Generacion)</text>
    <text x="45" y="107" class="body-text">- Generacion de terraform plan inmutable</text>
    <text x="45" y="129" class="body-text">- Archivo tfplan bloqueado con hash SHA-256</text>
    <text x="45" y="151" class="body-text">- Artefacto cargado como evidencia en CI/CD</text>
    <text x="45" y="173" class="body-text">- Cero mutacion real en la nube</text>
    <text x="45" y="195" class="bold-text" fill="#1D76DB">Retencion de artefacto: 2 dias</text>

    <!-- Bloque MFA -->
    <rect x="430" y="55" width="410" height="180" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" />
    <text x="445" y="82" class="bold-text" fill="#D93F0B">Compuerta Humana Colegiada (prod)</text>
    <text x="445" y="107" class="body-text">Aprobacion formal requerida por 4 roles:</text>
    <text x="445" y="129" class="body-text">1. Lider de Operaciones / DevOps Senior</text>
    <text x="445" y="151" class="body-text">2. Arquitecto Cloud Principal</text>
    <text x="445" y="173" class="body-text">3. Director Logistica FNC | 4. Oficial Ley 1581</text>
    <text x="445" y="200" class="bold-text" fill="#D93F0B">Autenticacion obligatoria con MFA FIDO2</text>

    <!-- Bloque Cero Apply -->
    <rect x="870" y="55" width="410" height="180" rx="6" fill="#EBF3FB" stroke="#1D76DB" stroke-width="2" />
    <text x="885" y="82" class="bold-text" fill="#1D76DB">Etapa: apply-prod (Verificacion)</text>
    <text x="885" y="107" class="body-text">- Descarga del plan inmutable verificado</text>
    <text x="885" y="129" class="body-text">- Evaluacion de flag ENABLE_TERRAFORM_APPLY</text>
    <text x="885" y="151" class="body-text">- Modo Zero-Cost Verification (FNC 2026)</text>
    <text x="885" y="173" class="bold-text" fill="#B71C1C">PROHIBIDO REALIZAR APPLY REAL EN AWS</text>
    <text x="885" y="200" class="body-text">Evidencia auditada sin generar costos cloud</text>

    <!-- Bloque FinOps y Legal -->
    <rect x="1310" y="55" width="330" height="180" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" />
    <text x="1325" y="82" class="bold-text" fill="#1B5E20">Respaldo FinOps y Soberania</text>
    <text x="1325" y="107" class="body-text">- Costo reposo: $0,00 USD / mes</text>
    <text x="1325" y="129" class="body-text">- Cero computo esperando paquetes</text>
    <text x="1325" y="151" class="body-text">- Tag Policy 7 etiquetas obligatorias</text>
    <text x="1325" y="173" class="body-text">- Invariante Budgets: Alerta 80% sin corte</text>
    <text x="1325" y="195" class="body-text">- Ley 1581: Cedulas y predios aislados</text>

    <!-- Flechas Seccion 4 -->
    <line x1="400" y1="145" x2="430" y2="145" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />
    <line x1="840" y1="145" x2="870" y2="145" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />
    <line x1="1280" y1="145" x2="1310" y2="145" stroke="#545B64" stroke-width="2" marker-end="url(#arrow-gray)" />
  </g>

</svg>