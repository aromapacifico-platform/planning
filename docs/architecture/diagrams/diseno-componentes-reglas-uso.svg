<text x="98" y="30" font-size="12" font-weight="700" fill="#86EFAC" letter-spacing="1.2">SYSTEM DESIGN · HU #37</text>
<text x="98" y="55" font-size="22" font-weight="800" fill="#FFFFFF">Cinco Componentes Base y Reglas de Uso en Campo</text>
<text x="98" y="77" font-size="13" font-weight="400" fill="#D1FAE5">Botón 56 px · Campo báscula · Alertas AAA · Distintivos con ícono real · Tarjeta de saco en 3 proyecciones</text>
<rect x="1517" y="30" width="135" height="30" rx="15" fill="#0F4C81" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1584" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Bundle &lt; 28 KB</text>
<rect x="1341" y="30" width="166" height="30" rx="15" fill="#135E34" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1424" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5 Componentes Base</text>
<g filter="url(#card-sh)"><rect x="36" y="116" width="520" height="390" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="56" y="148" font-size="15" font-weight="800" fill="#135E34">1. Botón Táctil (56 px Vehicular / 48 px Web)</text><rect x="56" y="168" width="480" height="56" rx="8" fill="#135E34"/><text x="296" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">REGISTRAR PESAJE (56 PX PRIMARIO)</text><text x="296" y="239" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#9E1B1B">-- separación obligatoria 12 px --</text><rect x="56" y="250" width="480" height="56" rx="8" fill="#9E1B1B"/><text x="296" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">ALERTA CRÍTICA / REPORTAR INCIDENTE</text><rect x="56" y="324" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/><text x="172" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#0F4C81">ACCIÓN SECUNDARIA</text><rect x="304" y="324" width="232" height="48" rx="8" fill="#E2E8F0"/><text x="420" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">DESHABILITADO</text><text x="56" y="408" font-size="12.5" font-weight="700" fill="#0F172A">Regla de simplicidad rural:</text><text x="56" y="432" font-size="12.5" fill="#475569">Máximo 2 botones primarios por pantalla.</text><text x="56" y="454" font-size="12.5" fill="#475569">Usable con guantes de lona o lluvia (56 px).</text></g>
<g filter="url(#card-sh)"><rect x="580" y="116" width="520" height="390" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="148" font-size="15" font-weight="800" fill="#0F4C81">2. Campo Numérico y 3. Alertas Fitosanitarias</text><text x="600" y="178" font-size="12" font-weight="700" fill="#334155">HUMEDAD ÓPTIMA (8.0 - 12.5 %)</text><rect x="600" y="188" width="228" height="48" rx="8" fill="#FFFFFF" stroke="#135E34" stroke-width="2"/><text x="618" y="220" class="mono" font-size="22" font-weight="800" fill="#0F172A">11.8 %</text><text x="844" y="178" font-size="12" font-weight="700" fill="#9E1B1B">ERROR FUERA DE RANGO</text><rect x="844" y="188" width="236" height="48" rx="8" fill="#FFF5F5" stroke="#9E1B1B" stroke-width="2.2"/><text x="862" y="220" class="mono" font-size="22" font-weight="800" fill="#9E1B1B">14.2 %</text><rect x="600" y="258" width="480" height="84" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.2"/><rect x="600" y="258" width="8" height="84" rx="4" fill="#B91C1C"/><text x="622" y="286" font-size="13.5" font-weight="800" fill="#7F1D1D">ALERTA CRÍTICA: FOCO DE ROYA CONFIRMADO</text><text x="622" y="310" font-size="12.5" fill="#7F1D1D">Lote 3 · Confianza 87 % · Requiere autorización MFA.</text><text x="622" y="330" class="mono" font-size="12" font-weight="700" fill="#9E1B1B">Contraste 9.16:1 AAA</text><rect x="600" y="358" width="480" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><rect x="600" y="358" width="8" height="74" rx="4" fill="#D97706"/><text x="622" y="386" font-size="13.5" font-weight="800" fill="#78350F">ADVERTENCIA: MODO SIN SEÑAL (BUFFER 24 H)</text><text x="622" y="410" font-size="12.5" fill="#78350F">Datos guardados en memoria local · Sincroniza al reconectar.</text><text x="600" y="466" font-size="12.5" fill="#475569">Validación instantánea sin depender de conexión a Internet.</text></g>
<g filter="url(#card-sh)"><rect x="1124" y="116" width="520" height="390" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="1144" y="148" font-size="15" font-weight="800" fill="#9E1B1B">4. Distintivos de Estado y Reglas de Campo</text><rect x="1144" y="170" width="228" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><g transform="translate(1154,180) scale(0.833)"><circle cx="12" cy="12" r="4" fill="none" stroke="#B45309" stroke-width="2.3"/><path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.9 4.9L7.1 7.1M16.9 16.9L19.1 19.1M19.1 4.9L16.9 7.1M7.1 16.9L4.9 19.1" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/></g><text x="1182" y="195" font-size="13" font-weight="800" fill="#78350F">EN PREPARACIÓN</text><rect x="1392" y="170" width="232" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><g transform="translate(1402,180) scale(0.833)"><rect x="2" y="6" width="13" height="10" rx="1.5" fill="none" stroke="#1D4ED8" stroke-width="2.2"/><path d="M15 9H19.5L22 12.5V16H15Z" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.2" fill="#1D4ED8"/><circle cx="18" cy="18" r="2.2" fill="#1D4ED8"/></g><text x="1430" y="195" font-size="13" font-weight="800" fill="#1E40AF">EN VIAJE</text><rect x="1144" y="224" width="228" height="40" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><g transform="translate(1154,234) scale(0.833)"><path d="M12 2L4 5.5V11.5C4 16.8 7.5 21 12 22.5C16.5 21 20 16.8 20 11.5V5.5Z" fill="#16A34A"/><path d="M8.5 12.2L10.8 14.6L15.8 9.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1182" y="249" font-size="13" font-weight="800" fill="#14532D">ACEPTADO</text><rect x="1392" y="224" width="232" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><g transform="translate(1402,234) scale(0.833)"><polygon points="8,2 16,2 22,8 22,16 16,22 8,22 2,16 2,8" fill="#DC2626"/><path d="M9 9L15 15M15 9L9 15" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g><text x="1430" y="249" font-size="13" font-weight="800" fill="#7F1D1D">RECHAZADO</text><rect x="1144" y="286" width="480" height="196" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="1162" y="314" font-size="13.5" font-weight="800" fill="#0F172A">Cinco Reglas Innegociables de Uso:</text><text x="1162" y="342" font-size="12.5" fill="#334155">1) Contraste AAA (&gt; 7:1) para lectura bajo sol directo.</text><text x="1162" y="368" font-size="12.5" fill="#334155">2) Íconos geométricos entendibles sin manual largo.</text><text x="1162" y="394" font-size="12.5" fill="#334155">3) Cero menús hamburguesa complejos en campo.</text><text x="1162" y="420" font-size="12.5" fill="#334155">4) Vista del comprador sin datos personales (Ley 1581).</text><text x="1162" y="446" font-size="12.5" fill="#135E34" font-weight="700">5) Bundle CSS+SVG &lt; 28 KB (carga &lt; 1.8 s a 128 kbps).</text></g>
<g filter="url(#card-sh)"><rect x="36" y="532" width="1608" height="330" rx="12" fill="#FFFFFF" stroke="#135E34" stroke-width="2"/><text x="58" y="566" font-size="15.5" font-weight="800" fill="#0F172A">5. Componente Tarjeta de Saco (60 kg) · Tres Proyecciones Disjuntas por Rol (Ley 1581)</text>
<rect x="58" y="586" width="496" height="250" rx="10" fill="#FAF8F5" stroke="#135E34" stroke-width="1.8"/><text x="78" y="614" font-size="12" font-weight="800" fill="#135E34">VISTA A · COMPRADOR (TABLA sacos_publicos)</text><text x="78" y="644" class="mono" font-size="17" font-weight="800" fill="#0F172A">SACO-2026-CAU-7F3A9C12</text><rect x="380" y="622" width="154" height="32" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><g transform="translate(388,629) scale(0.750)"><path d="M12 2L4 5.5V11.5C4 16.8 7.5 21 12 22.5C16.5 21 20 16.8 20 11.5V5.5Z" fill="#16A34A"/><path d="M8.5 12.2L10.8 14.6L15.8 9.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="414" y="643" font-size="12.5" font-weight="800" fill="#14532D">ACEPTADO</text><text x="78" y="684" font-size="13" fill="#334155">Origen: Cauca · Popayán  |  Variedad: Castillo</text><text x="78" y="708" font-size="13" fill="#334155">Secado: 11.8 % · 21 °C  |  Peso: 60.0 kg</text><text x="78" y="732" font-size="13" fill="#334155">Entrega: Puerto Buenaventura (Certificado SCA)</text><rect x="78" y="754" width="456" height="62" rx="6" fill="#FEF2F2" stroke="#9E1B1B" stroke-width="1.4" stroke-dasharray="4,3"/><text x="92" y="778" font-size="12" font-weight="800" fill="#9E1B1B">CAMPOS BLOQUEADOS (LEY 1581):</text><text x="92" y="800" font-size="12" fill="#7F1D1D">Sin cédula, sin nombre del caficultor, sin GPS ni ruta.</text>
<rect x="592" y="586" width="496" height="250" rx="10" fill="#F3F8FC" stroke="#0F4C81" stroke-width="1.8"/><text x="612" y="614" font-size="12" font-weight="800" fill="#0F4C81">VISTA B · CENTRO DE ACOPIO (COGNITO MFA)</text><text x="612" y="644" class="mono" font-size="17" font-weight="800" fill="#0F172A">MANIFIESTO #TR-2026-084</text><rect x="924" y="622" width="144" height="32" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><g transform="translate(932,629) scale(0.750)"><rect x="2" y="6" width="13" height="10" rx="1.5" fill="none" stroke="#1D4ED8" stroke-width="2.2"/><path d="M15 9H19.5L22 12.5V16H15Z" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.2" fill="#1D4ED8"/><circle cx="18" cy="18" r="2.2" fill="#1D4ED8"/></g><text x="958" y="643" font-size="12.5" font-weight="800" fill="#1E40AF">EN VIAJE</text><text x="612" y="684" font-size="13" fill="#334155">Viaje: Acopio Cauca -&gt; Muelle Buenaventura</text><text x="612" y="708" font-size="13" fill="#334155">Precinto: #PREC-CAU-88219 · 45 sacos (2.700 kg)</text><text x="612" y="732" font-size="13" fill="#334155">Catación SCA: 86.5 pts · Impresión térmica 203 DPI</text><rect x="612" y="754" width="456" height="62" rx="6" fill="#FFFFFF" stroke="#0F4C81" stroke-width="1.3"/><text x="626" y="778" font-size="12" font-weight="800" fill="#0F4C81">ALCANCE CONTROLADO:</text><text x="626" y="800" font-size="12" fill="#334155">Operario solo visualiza viajes de su departamento (AcopioID).</text>
<rect x="1126" y="586" width="496" height="250" rx="10" fill="#FFFBF5" stroke="#B45309" stroke-width="1.8"/><text x="1146" y="614" font-size="12" font-weight="800" fill="#B45309">VISTA C · CAFICULTOR (SOLO SUS FINCAS)</text><text x="1146" y="644" font-size="17" font-weight="800" fill="#0F172A">Finca Las Brisas · Lote 3</text><rect x="1416" y="622" width="186" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><g transform="translate(1424,629) scale(0.750)"><circle cx="12" cy="12" r="4" fill="none" stroke="#B45309" stroke-width="2.3"/><path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.9 4.9L7.1 7.1M16.9 16.9L19.1 19.1M19.1 4.9L16.9 7.1M7.1 16.9L4.9 19.1" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/></g><text x="1450" y="643" font-size="12.5" font-weight="800" fill="#78350F">EN PREPARACIÓN</text><text x="1146" y="684" font-size="13" fill="#334155">4 sacos pesados hoy (60.0 kg · Humedad 11.8 %)</text><text x="1146" y="708" font-size="13" fill="#334155">1 alerta fitosanitaria activa (Roya confirmada S2)</text><text x="1146" y="732" font-size="13" fill="#334155">Historial propio de 5 años · Buffer flash 24 h</text><rect x="1146" y="754" width="456" height="62" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/><text x="1160" y="778" font-size="12" font-weight="800" fill="#B45309">PRIVACIDAD TOTAL:</text><text x="1160" y="800" font-size="12" fill="#334155">Aislado por sub de Cognito · Cero acceso a otras fincas.</text>
</g>
<rect x="36" y="886" width="1608" height="60" rx="8" fill="#ECFDF5" stroke="#135E34" stroke-width="1.5"/><text x="56" y="921" font-size="13" font-weight="700" fill="#135E34">Impacto FinOps (HU #37): </text><text x="234" y="921" font-size="12.5" fill="#1E293B">Catálogo único de 5 componentes reutilizables (&lt; 28 KB) evita USD 14.040/año en retrabajo frontend y consumo de datos rurales.</text>
