<filter id="card-sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/></filter>
<style>text{font-family:'Segoe UI',Inter,Arial,sans-serif;} .mono{font-family:Consolas,'Fira Code',monospace;}</style>
</defs>
<rect x="0" y="0" width="1480" height="880" fill="#FAF8F5"/>
<rect x="0" y="0" width="1480" height="92" fill="#0A3D20"/>
<rect x="0" y="89" width="1480" height="3" fill="#4ADE80"/>
<g transform="translate(28,17) scale(0.56)"><circle cx="50" cy="50" r="46" fill="#0A3D20" stroke="#4ADE80" stroke-width="2.5"/><path d="M 47.5,14 C 29,14 17,29 17,50 C 17,71 29,86 47.5,86 C 42,72 43,60 46.5,50 C 50,40 51,28 47.5,14 Z" fill="#FFFFFF"/><path d="M 52.5,14 C 56,28 55,40 51.5,47 C 64,45 76,40 81,30 C 78,19 68,14 52.5,14 Z" fill="#86EFAC"/><path d="M 51.5,53 C 48,60 47,72 52.5,86 C 68,86 83,73 83,52 C 75,51 63,52 51.5,53 Z" fill="#E2E8F0"/></g>
<text x="98" y="30" font-size="12" font-weight="700" fill="#86EFAC" letter-spacing="1.2">LÁMINA 2 DE 3 · APP DEL TRANSPORTADOR</text>
<text x="98" y="55" font-size="22" font-weight="800" fill="#FFFFFF">Aplicación Móvil del Transportador (Cabina a 65 cm y Ruta)</text>
<text x="98" y="77" font-size="13" font-weight="400" fill="#D1FAE5">Ergonomía vehicular ISO 15008 · GPS cada 5 minutos en SQLite cifrado · Entrega directa en Buenaventura</text>
<rect x="1317" y="30" width="135" height="30" rx="15" fill="#B45309" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1384" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">SQLite Offline</text>
<rect x="1086" y="30" width="221" height="30" rx="15" fill="#0F4C81" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1196" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Cabina 65 cm · Mín. 14 px</text>
<g transform="translate(48,134)" filter="url(#card-sh)"><rect x="0" y="0" width="410" height="680" rx="34" fill="#0F172A"/><rect x="10" y="10" width="390" height="660" rx="26" fill="#FAF8F5"/><rect x="10" y="10" width="390" height="66" rx="26" fill="#0F4C81"/><rect x="10" y="48" width="390" height="28" fill="#0F4C81"/><text x="30" y="34" font-size="12" font-weight="700" fill="#BAE6FD">CABINA 65 CM · GPS CADA 5 MIN</text><text x="30" y="60" font-size="16" font-weight="800" fill="#FFFFFF">Camión C-402 · #TR-2026-084</text><rect x="26" y="92" width="358" height="148" rx="12" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/><text x="205" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">CARGA ASIGNADA EN RUTA</text><text x="205" y="164" text-anchor="middle" font-size="34" font-weight="800" fill="#0F172A">45 SACOS</text><text x="205" y="190" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0F4C81">2.700 KG BRUTOS (60 kg c/u)</text><rect x="86" y="200" width="238" height="30" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><g transform="translate(96,206) scale(0.750)"><rect x="2" y="6" width="13" height="10" rx="1.5" fill="none" stroke="#1D4ED8" stroke-width="2.2"/><path d="M15 9H19.5L22 12.5V16H15Z" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.2" fill="#1D4ED8"/><circle cx="18" cy="18" r="2.2" fill="#1D4ED8"/></g><text x="122" y="220" font-size="12.5" font-weight="800" fill="#1E40AF">EN VIAJE A BUENAVENTURA</text><rect x="26" y="256" width="358" height="122" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="42" y="282" font-size="13" font-weight="800" fill="#0F172A">HOJA DE RUTA LOGÍSTICA</text><text x="42" y="308" font-size="14" font-weight="600" fill="#334155">Origen: Acopio Cauca (06:30 COT)</text><text x="42" y="334" font-size="14" font-weight="600" fill="#0F4C81">Destino: Muelle Buenaventura (14:30)</text><text x="42" y="360" class="mono" font-size="13" font-weight="700" fill="#135E34">Precinto: #PREC-CAU-88219 OK</text><rect x="26" y="398" width="358" height="56" rx="8" fill="#135E34"/><text x="205" y="432" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">REGISTRAR ENTREGA EN PUERTO</text><text x="205" y="468" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#64748B">guarda táctil 12 px</text><rect x="26" y="476" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#9E1B1B" stroke-width="2.2"/><text x="205" y="510" text-anchor="middle" font-size="15.5" font-weight="800" fill="#9E1B1B">REPORTAR INCIDENTE EN RUTA</text><rect x="26" y="552" width="358" height="94" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/><text x="42" y="580" font-size="13" font-weight="800" fill="#78350F">SIN SEÑAL EN VÍA TERCIARIA</text><text x="42" y="606" font-size="13" font-weight="600" fill="#78350F">SQLite cifrado: 3 puntos GPS en cola</text><text x="42" y="630" font-size="12" fill="#92400E">Sube lotes idempotentes al recuperar 4G</text></g>
<g filter="url(#card-sh)"><rect x="508" y="134" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#0F4C81" stroke-width="1.8"/><rect x="508" y="134" width="8" height="120" rx="4" fill="#0F4C81"/><rect x="532" y="150" width="169" height="24" rx="12" fill="#0F4C81"/><text x="542" y="166" font-size="12" font-weight="700" fill="#FFFFFF">ISO 15008 · 65 CM</text><text x="532" y="202" font-size="16" font-weight="800" fill="#0F172A">Tipografía Vehicular Sobredimensionada</text><text x="532" y="228" font-size="13.5" fill="#334155">Métrica principal de carga (45 SACOS · 2.700 KG) en 32-40 px Heavy; prohibido texto menor a 14 px en cabina.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="274" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#9E1B1B" stroke-width="1.8"/><rect x="508" y="274" width="8" height="120" rx="4" fill="#9E1B1B"/><rect x="532" y="290" width="144" height="24" rx="12" fill="#9E1B1B"/><text x="542" y="306" font-size="12" font-weight="700" fill="#FFFFFF">SEGURIDAD VIAL</text><text x="532" y="342" font-size="16" font-weight="800" fill="#0F172A">Guarda Táctil de 12 px Contra Vibración</text><text x="532" y="368" font-size="13.5" fill="#334155">Botones críticos de 56 px separados 12 px entre sí para evitar toques accidentales en vías terciarias.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="414" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/><rect x="508" y="414" width="8" height="120" rx="4" fill="#B45309"/><rect x="532" y="430" width="144" height="24" rx="12" fill="#B45309"/><text x="542" y="446" font-size="12" font-weight="700" fill="#FFFFFF">GPS CADA 5 MIN</text><text x="532" y="482" font-size="16" font-weight="800" fill="#0F172A">Persistencia Offline en SQLite Cifrado</text><text x="532" y="508" font-size="13.5" fill="#334155">Sin señal 4G en carretera, los puntos GPS se encolan cifrados y suben en lotes idempotentes al reconectar.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="554" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#135E34" stroke-width="1.8"/><rect x="508" y="554" width="8" height="120" rx="4" fill="#135E34"/><rect x="532" y="570" width="127" height="24" rx="12" fill="#135E34"/><text x="542" y="586" font-size="12" font-weight="700" fill="#FFFFFF">BUENAVENTURA</text><text x="532" y="622" font-size="16" font-weight="800" fill="#0F172A">Registro de Entrega Sin Servidores FNC</text><text x="532" y="648" font-size="13.5" fill="#334155">El conductor registra la recepción final en el muelle desde la app móvil; cero infraestructura local en puerto.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="694" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/><rect x="508" y="694" width="8" height="120" rx="4" fill="#0F172A"/><rect x="532" y="710" width="135" height="24" rx="12" fill="#0F172A"/><text x="542" y="726" font-size="12" font-weight="700" fill="#FFFFFF">MODO NOCTURNO</text><text x="532" y="762" font-size="16" font-weight="800" fill="#0F172A">Variante Negativa Antideslumbramiento</text><text x="532" y="788" font-size="13.5" fill="#334155">Cabecera oscura y logo en negativo para trayectos nocturnos entre Cauca, Huila, Tolima y el Pacífico.</text></g>
</svg>