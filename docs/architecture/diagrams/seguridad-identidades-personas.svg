<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1260" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #232F3E; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #5A6B7C; text-anchor: middle; }
      .header-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #232F3E; }
      .subhead-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #555555; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #232F3E; }
      .mono-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #111111; }
      .th-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .badge-mfa { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #D93F0B; text-anchor: middle; }
      .badge-norm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #555555; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- FONDO GENERAL -->
  <rect width="1760" height="1260" fill="#F8F9FA" />

  <!-- TITULO Y SUBTITULO -->
  <text x="880" y="45" class="title">AromaPacífico - Arquitectura de Identidades de Personas, Autenticación y Control de Acceso</text>
  <text x="880" y="75" class="subtitle">Segregación de Perfiles Humanos: Amazon Cognito User Pool (Aplicaciones) vs AWS IAM Identity Center (Gobernanza Cloud) con MFA Obligatorio</text>

  <!-- PANELES SUPERIORES -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="800" height="200" rx="8" fill="#FFFFFF" stroke="#1D76DB" stroke-width="2" />
    <rect width="800" height="35" rx="8" fill="#EBF3FB" />
    <text x="20" y="24" class="header-box" fill="#1D76DB">GOBERNANZA DE IDENTIDADES HUMANAS (Zero Trust)</text>
    <text x="20" y="55" class="subhead-box">Segregación Categórica entre Usuarios de Aplicación y Operadores de Nube</text>
    <text x="20" y="80" class="body-text" font-weight="bold">1. Amazon Cognito User Pool (Cuenta Producción):</text>
    <text x="35" y="98" class="body-text">- Maneja los 5 perfiles operacionales de campo y clientes de negocio.</text>
    <text x="35" y="115" class="body-text">- Tokens JWT estándar (ID Token, Access Token, Refresh Token) con expiración de 60 min.</text>
    <text x="35" y="132" class="body-text">- Integración nativa con Amazon API Gateway y Application Load Balancers.</text>
    <text x="20" y="155" class="body-text" font-weight="bold">2. AWS IAM Identity Center (Cuenta Raíz - Management):</text>
    <text x="35" y="173" class="body-text">- Control de acceso exclusivo para ingenieros de plataforma, DevOps y auditores cloud.</text>
    <text x="35" y="190" class="body-text">- Sesiones temporales asumidas con STS (máximo 4 horas) y trazabilidad total en CloudTrail.</text>
  </g>

  <g transform="translate(880, 110)" filter="url(#shadow)">
    <rect width="830" height="200" rx="8" fill="#FFFFFF" stroke="#D93F0B" stroke-width="2" />
    <rect width="830" height="35" rx="8" fill="#FFF5F5" />
    <text x="20" y="24" class="header-box" fill="#D93F0B">POLÍTICA DE AUTENTICACIÓN MULTIFACTOR (MFA MANDATORIO)</text>
    <text x="20" y="55" class="subhead-box">Aplicación Estricta según Evaluación de Riesgo de Negocio</text>
    <text x="20" y="80" class="body-text" font-weight="bold">Perfiles con MFA Obligatorio (Sin excepciones):</text>
    <text x="35" y="98" class="body-text">1. Operario de Acopio (Cognito): Previene manipulación de pesaje y recepción de sacos.</text>
    <text x="35" y="115" class="body-text">2. Operador de Drones (Cognito): Previene ejecución no autorizada de vuelos y fumigación (RAC 100).</text>
    <text x="35" y="132" class="body-text">3. Operador de Plataforma (IAM Identity Center): Previene modificaciones de infraestructura IaC.</text>
    <text x="20" y="155" class="body-text" font-weight="bold">Tecnología: Aplicaciones de Autenticación TOTP (RFC 6238) y Llaves FIDO2 / WebAuthn.</text>
    <text x="20" y="173" class="body-text">Justificación: Se rechaza SMS OTP por vulnerabilidad a SIM Swapping y nula cobertura en campo.</text>
  </g>

  <!-- CONTENEDOR: LOS SEIS PERFILES -->
  <g transform="translate(50, 340)" filter="url(#shadow)">
    <rect width="1660" height="880" rx="8" fill="#FFFFFF" stroke="#545B64" stroke-width="2" />
    <rect width="1660" height="35" rx="8" fill="#EAEDED" />
    <text x="20" y="24" class="header-box">MATRIZ DE PERFILES HUMANOS, AUTENTICACIÓN Y ROLES DE ACCESO SIN COMODINES</text>

    <!-- TARJETAS DE LOS 6 PERFILES -->
    <!-- 1. CAFICULTOR -->
    <g transform="translate(20, 50)">
      <rect width="255" height="190" rx="6" fill="#F8F9FA" stroke="#0E8A16" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#0E8A16">1. Caficultor</text>
      <text x="15" y="45" class="body-text" font-weight="bold">App Caficultor (Móvil)</text>
      <text x="15" y="68" class="body-text">- Auth: Amazon Cognito</text>
      <text x="15" y="86" class="body-text">- MFA: Opcional (Recomendado)</text>
      <text x="15" y="104" class="body-text">- Lectura: Telemetría de sus fincas,</text>
      <text x="25" y="120" class="body-text">alertas, estado de sus sacos.</text>
      <text x="15" y="138" class="body-text">- Escritura: Alta de sacos de 60 kg.</text>
      <text x="15" y="156" class="body-text">- Restricción: No accede a fincas</text>
      <text x="25" y="172" class="body-text">ajenas ni a consola AWS.</text>
    </g>

    <!-- 2. TRANSPORTADOR -->
    <g transform="translate(295, 50)">
      <rect width="255" height="190" rx="6" fill="#F8F9FA" stroke="#0E8A16" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#0E8A16">2. Transportador</text>
      <text x="15" y="45" class="body-text" font-weight="bold">App Transportador (Móvil)</text>
      <text x="15" y="68" class="body-text">- Auth: Amazon Cognito</text>
      <text x="15" y="86" class="body-text">- MFA: Opcional (Recomendado)</text>
      <text x="15" y="104" class="body-text">- Lectura: Rutas y sacos asignados,</text>
      <text x="25" y="120" class="body-text">manifiesto de carga.</text>
      <text x="15" y="138" class="body-text">- Escritura: GPS cada 5 min, custodia.</text>
      <text x="15" y="156" class="body-text">- Restricción: No ve datos del</text>
      <text x="25" y="172" class="body-text">comprador ni umbrales agronómicos.</text>
    </g>

    <!-- 3. OPERARIO DE ACOPIO -->
    <g transform="translate(570, 50)">
      <rect width="255" height="190" rx="6" fill="#FFF5F5" stroke="#D93F0B" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#D93F0B">3. Operario de Acopio</text>
      <text x="15" y="45" class="body-text" font-weight="bold">Portal Recepción Acopio (LAN)</text>
      <text x="15" y="68" class="body-text">- Auth: Amazon Cognito</text>
      <text x="15" y="86" class="body-text" font-weight="bold" fill="#D93F0B">- MFA: OBLIGATORIO (TOTP)</text>
      <text x="15" y="104" class="body-text">- Lectura: Manifiestos, datos viaje,</text>
      <text x="25" y="120" class="body-text">variables de secado del lote.</text>
      <text x="15" y="138" class="body-text">- Escritura: Recepción, pesaje, hojas.</text>
      <text x="15" y="156" class="body-text">- Restricción: Solo desde la VLAN</text>
      <text x="25" y="172" class="body-text">de Logística (10.X.3.0/24).</text>
    </g>

    <!-- 4. COMPRADOR -->
    <g transform="translate(845, 50)">
      <rect width="255" height="190" rx="6" fill="#F8F9FA" stroke="#1D76DB" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#1D76DB">4. Comprador</text>
      <text x="15" y="45" class="body-text" font-weight="bold">Consulta Pública (Web)</text>
      <text x="15" y="68" class="body-text">- Auth: Cognito / Público</text>
      <text x="15" y="86" class="body-text">- MFA: No Aplica (Solo Lectura)</text>
      <text x="15" y="104" class="body-text">- Lectura: Código saco, origen,</text>
      <text x="25" y="120" class="body-text">fechas proceso, estado y secado.</text>
      <text x="15" y="138" class="body-text">- Escritura: NINGUNA (Solo Lectura).</text>
      <text x="15" y="156" class="body-text">- Restricción: PROHIBIDO serializar</text>
      <text x="25" y="172" class="body-text">cédula de caficultor ni rutas.</text>
    </g>

    <!-- 5. OPERADOR DE DRONES -->
    <g transform="translate(1120, 50)">
      <rect width="255" height="190" rx="6" fill="#FFF5F5" stroke="#D93F0B" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#D93F0B">5. Operador Drones</text>
      <text x="15" y="45" class="body-text" font-weight="bold">Tableta GCS y Estación</text>
      <text x="15" y="68" class="body-text">- Auth: Amazon Cognito</text>
      <text x="15" y="86" class="body-text" font-weight="bold" fill="#D93F0B">- MFA: OBLIGATORIO (TOTP/FIDO2)</text>
      <text x="15" y="104" class="body-text">- Lectura: Órdenes, polígonos GeoJSON,</text>
      <text x="25" y="120" class="body-text">zonas No-Fly, diagnóstico.</text>
      <text x="15" y="138" class="body-text">- Escritura: Bitácora S3, fotos S4.</text>
      <text x="15" y="156" class="body-text">- Restricción: No puede autorizar</text>
      <text x="25" y="172" class="body-text">fumigación sin agrónomo FNC.</text>
    </g>

    <!-- 6. OPERADOR PLATAFORMA -->
    <g transform="translate(1395, 50)">
      <rect width="245" height="190" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" />
      <text x="15" y="25" class="header-box" fill="#FF9900">6. DevOps Cloud</text>
      <text x="15" y="45" class="body-text" font-weight="bold">Consola AWS y CLI</text>
      <text x="15" y="68" class="body-text">- Auth: AWS IAM Identity Center</text>
      <text x="15" y="86" class="body-text" font-weight="bold" fill="#D93F0B">- MFA: OBLIGATORIO (WebAuthn)</text>
      <text x="15" y="104" class="body-text">- Lectura: Logs, métricas, VPCs.</text>
      <text x="15" y="122" class="body-text">- Escritura: Terraform CI/CD,</text>
      <text x="25" y="138" class="body-text">baja de certificados IoT.</text>
      <text x="15" y="156" class="body-text">- Restricción: Sin acceso a PII ni</text>
      <text x="25" y="172" class="body-text">modificación de logs WORM.</text>
    </g>

    <!-- PROVEEDORES DE AUTENTICACION -->
    <g transform="translate(20, 260)">
      <rect width="1355" height="40" rx="6" fill="#EBF3FB" stroke="#1D76DB" stroke-width="1.5" />
      <text x="677" y="25" class="body-text" font-weight="bold" fill="#1D76DB" text-anchor="middle">SERVICIO DE IDENTIDADES DE APLICACIÓN: AMAZON COGNITO USER POOL (Cuenta Producción - us-east-1)</text>
    </g>

    <g transform="translate(1395, 260)">
      <rect width="245" height="40" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="1.5" />
      <text x="122" y="25" class="body-text" font-weight="bold" fill="#FF9900" text-anchor="middle">IAM IDENTITY CENTER (Root)</text>
    </g>

    <!-- TABLA DE PERMISOS DETALLADA -->
    <g transform="translate(20, 320)">
      <!-- ENCABEZADOS -->
      <rect x="0" y="0" width="1620" height="30" fill="#232F3E" />
      <text x="80" y="20" class="th-title">Perfil / Rol</text>
      <text x="220" y="20" class="th-title">Proveedor Auth</text>
      <text x="350" y="20" class="th-title">MFA Exigido</text>
      <text x="590" y="20" class="th-title">Acciones de Lectura Permitidas (Get / Query)</text>
      <text x="980" y="20" class="th-title">Acciones de Escritura Permitidas (Put / Post / Update)</text>
      <text x="1400" y="20" class="th-title">Recurso ARN Específico (Cero Comodines *)</text>

      <!-- FILA 1: CAFICULTOR -->
      <rect x="0" y="30" width="1620" height="75" fill="#FFFFFF" stroke="#EAEDED" />
      <text x="15" y="55" class="body-text" font-weight="bold">Caficultor</text>
      <text x="15" y="72" class="badge-norm">App Móvil Finca</text>
      <text x="220" y="65" class="badge-norm">Cognito User Pool</text>
      <text x="350" y="65" class="badge-norm">Opcional (Recomendado)</text>
      <text x="440" y="55" class="mono-text">dynamodb:GetItem, dynamodb:Query</text>
      <text x="440" y="75" class="body-text">Lectura de telemetría de suelo/secado y alertas de su finca</text>
      <text x="830" y="55" class="mono-text">dynamodb:PutItem, execute-api:Invoke</text>
      <text x="830" y="75" class="body-text">Alta de saco de 60 kg en finca y registro de lote</text>
      <text x="1220" y="55" class="mono-text">table/telemetria_cultivo, table/sacos_cafe</text>
      <text x="1220" y="75" class="body-text">Condición: LeadingKeys = [${cognito-identity.amazonaws.com:sub}]</text>

      <!-- FILA 2: TRANSPORTADOR -->
      <rect x="0" y="105" width="1620" height="75" fill="#F8F9FA" stroke="#EAEDED" />
      <text x="15" y="130" class="body-text" font-weight="bold">Transportador</text>
      <text x="15" y="147" class="badge-norm">App Móvil Ruta</text>
      <text x="220" y="140" class="badge-norm">Cognito User Pool</text>
      <text x="350" y="140" class="badge-norm">Opcional (Recomendado)</text>
      <text x="440" y="130" class="mono-text">dynamodb:GetItem, execute-api:Invoke</text>
      <text x="440" y="150" class="body-text">Consulta de manifiesto de carga y sacos asignados en viaje</text>
      <text x="830" y="130" class="mono-text">iot:Publish, dynamodb:UpdateItem</text>
      <text x="830" y="150" class="body-text">Publicación GPS cada 5 min y custodia física del saco</text>
      <text x="1220" y="130" class="mono-text">topic/aromapacifico/transportador/${sub}/gps</text>
      <text x="1220" y="150" class="body-text">table/viajes_transporte (ViajeID = ${cognito:viaje_id})</text>

      <!-- FILA 3: OPERARIO DE ACOPIO -->
      <rect x="0" y="180" width="1620" height="85" fill="#FFF5F5" stroke="#EAEDED" />
      <text x="15" y="205" class="body-text" font-weight="bold" fill="#D93F0B">Operario de Acopio</text>
      <text x="15" y="222" class="badge-norm">Portal Recepción LAN</text>
      <text x="220" y="215" class="badge-norm">Cognito User Pool</text>
      <text x="350" y="210" class="badge-mfa">MANDATORIO</text>
      <text x="350" y="228" class="badge-mfa">(TOTP / WebAuthn)</text>
      <text x="440" y="205" class="mono-text">dynamodb:Query, dynamodb:GetItem</text>
      <text x="440" y="225" class="body-text">Consulta de manifiestos entrantes, pesaje y secado de lote</text>
      <text x="830" y="205" class="mono-text">dynamodb:UpdateItem, sqs:SendMessage</text>
      <text x="830" y="225" class="body-text">Recepción saco (aceptado/rechazado), cola impresión códigos</text>
      <text x="1220" y="205" class="mono-text">table/sacos_cafe, cola_impresion_acopio_${AcopioID}</text>
      <text x="1220" y="225" class="body-text">Restricción: VLAN Logística 10.X.3.0/24 y claim mfa_verified=true</text>

      <!-- FILA 4: COMPRADOR -->
      <rect x="0" y="265" width="1620" height="75" fill="#FFFFFF" stroke="#EAEDED" />
      <text x="15" y="290" class="body-text" font-weight="bold">Comprador</text>
      <text x="15" y="307" class="badge-norm">Portal Consulta Web</text>
      <text x="220" y="300" class="badge-norm">Cognito / Público</text>
      <text x="350" y="300" class="badge-norm">No Aplica (Solo Lectura)</text>
      <text x="440" y="290" class="mono-text">execute-api:Invoke, dynamodb:GetItem</text>
      <text x="440" y="310" class="body-text">Consulta de código de saco: origen, variedad, secado, estado</text>
      <text x="830" y="290" class="mono-text" fill="#D93F0B">BLOQUEADO (Cero Escritura)</text>
      <text x="830" y="310" class="body-text">Denegación explícita de operaciones de modificación</text>
      <text x="1220" y="290" class="mono-text">api/*/GET/v1/sacos/*, table/sacos_publicos</text>
      <text x="1220" y="310" class="body-text">Ley 1581: Prohibida serialización de cédula y geolocalización</text>

      <!-- FILA 5: OPERADOR DE DRONES -->
      <rect x="0" y="340" width="1620" height="85" fill="#FFF5F5" stroke="#EAEDED" />
      <text x="15" y="365" class="body-text" font-weight="bold" fill="#D93F0B">Operador Drones</text>
      <text x="15" y="382" class="badge-norm">Tableta GCS / Piloto</text>
      <text x="220" y="375" class="badge-norm">Cognito User Pool</text>
      <text x="350" y="370" class="badge-mfa">MANDATORIO</text>
      <text x="350" y="388" class="badge-mfa">(TOTP / FIDO2)</text>
      <text x="440" y="365" class="mono-text">dynamodb:GetItem, s3:GetObject</text>
      <text x="440" y="385" class="body-text">Descarga de órdenes autorizadas, polígonos y zonas No-Fly</text>
      <text x="830" y="365" class="mono-text">s3:PutObject, dynamodb:UpdateItem</text>
      <text x="830" y="385" class="body-text">Carga de bitácoras .bin y fotos S4. Requiere firma de agrónomo</text>
      <text x="1220" y="365" class="mono-text">s3:::aromapacifico-drones-prod/misiones/*</text>
      <text x="1220" y="385" class="body-text">table/ordenes_fumigacion (Vincular hash SHA-256 de vuelo)</text>

      <!-- FILA 6: OPERADOR PLATAFORMA -->
      <rect x="0" y="425" width="1620" height="85" fill="#FFF8E1" stroke="#EAEDED" />
      <text x="15" y="450" class="body-text" font-weight="bold" fill="#FF9900">Operador Plataforma</text>
      <text x="15" y="467" class="badge-norm">Ingeniero DevOps Cloud</text>
      <text x="220" y="460" class="badge-norm">IAM Identity Center</text>
      <text x="350" y="455" class="badge-mfa">MANDATORIO</text>
      <text x="350" y="473" class="badge-mfa">(WebAuthn / YubiKey)</text>
      <text x="440" y="450" class="mono-text">cloudwatch:Get*, logs:FilterLogEvents, config:Get*</text>
      <text x="440" y="470" class="body-text">Monitoreo operativo, observabilidad y estado de infraestructura</text>
      <text x="830" y="450" class="mono-text">iam:*, iot:UpdateCertificate, terraform:apply</text>
      <text x="830" y="470" class="body-text">Despliegues IaC controlados por CI/CD y baja de dispositivos</text>
      <text x="1220" y="450" class="mono-text">arn:aws:iam::*:role/AromaPacifico-DevOpsRole</text>
      <text x="1220" y="470" class="body-text">Restricción: SCPs de Organizations e inmutabilidad de logs</text>
    </g>
  </g>
</svg>