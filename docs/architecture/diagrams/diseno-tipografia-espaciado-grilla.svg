<text x="98" y="30" font-size="12" font-weight="700" fill="#86EFAC" letter-spacing="1.2">SYSTEM DESIGN · HU #36</text>
<text x="98" y="55" font-size="22" font-weight="800" fill="#FFFFFF">Tipografía Dual (Cabina vs. Web), Espaciado 8 pt y Grillas</text>
<text x="98" y="77" font-size="13" font-weight="400" fill="#D1FAE5">Escala vehicular ISO 15008 para lectura a 65 cm · Escala analítica web · Ergonomía táctil de 56 px</text>
<rect x="1424" y="30" width="228" height="30" rx="15" fill="#135E34" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1538" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Botón 56 px / Guarda 12 px</text>
<rect x="1256" y="30" width="158" height="30" rx="15" fill="#0F4C81" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1335" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Mín. 14 px Cabina</text>
<g filter="url(#card-sh)"><rect x="36" y="118" width="790" height="440" rx="12" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/><path d="M48,118 H814 Q826,118 826,130 V162 H36 V130 Q36,118 48,118 Z" fill="#0F4C81"/><text x="56" y="146" font-size="14.5" font-weight="700" fill="#FFFFFF">1. Escala Móvil / Cabina Vehicular (Ratio 1.25 · 65 cm · ISO 15008)</text><text x="56" y="210" font-size="38" font-weight="800" fill="#0F172A">45 SACOS · 2.700 KG</text><text x="640" y="204" class="mono" font-size="12.5" font-weight="700" fill="#0F4C81">Display 40 px / 800</text><line x1="56" y1="228" x2="804" y2="228" stroke="#E2E8F0"/><text x="56" y="270" font-size="30" font-weight="800" fill="#135E34">60.0 KG · 11.8 %</text><text x="640" y="266" class="mono" font-size="12.5" font-weight="700" fill="#0F4C81">Métrica 32 px / 800</text><line x1="56" y1="288" x2="804" y2="288" stroke="#E2E8F0"/><text x="56" y="324" font-size="24" font-weight="700" fill="#0F172A">Destino: Puerto Buenaventura</text><text x="640" y="320" class="mono" font-size="12.5" font-weight="700" fill="#0F4C81">Título 24 px / 700</text><line x1="56" y1="342" x2="804" y2="342" stroke="#E2E8F0"/><text x="56" y="376" font-size="18" font-weight="600" fill="#1E293B">Cuerpo legible bajo vibración en trocha</text><text x="640" y="374" class="mono" font-size="12.5" font-weight="700" fill="#0F4C81">Cuerpo 18 px / 600</text><line x1="56" y1="394" x2="804" y2="394" stroke="#E2E8F0"/><text x="56" y="424" font-size="14" font-weight="600" fill="#475569">Mínimo absoluto en cabina: 14 px SemiBold (marcas de tiempo)</text><text x="640" y="424" class="mono" font-size="12.5" font-weight="700" fill="#9E1B1B">Mínimo 14 px / 600</text><rect x="56" y="454" width="748" height="80" rx="8" fill="#FEF2F2" stroke="#9E1B1B" stroke-width="1.5"/><text x="74" y="482" font-size="13" font-weight="800" fill="#9E1B1B">REGLA DE SEGURIDAD VIAL (CABINA):</text><text x="74" y="506" font-size="12.5" fill="#7F1D1D">Prohibido usar textos de 10-12 px en la App del Transportador. Lectura segura &lt; 1.5 s con vehículo detenido.</text></g>
<g filter="url(#card-sh)"><rect x="854" y="118" width="790" height="440" rx="12" fill="#FFFFFF" stroke="#135E34" stroke-width="2"/><path d="M866,118 H1632 Q1644,118 1644,130 V162 H854 V130 Q854,118 866,118 Z" fill="#135E34"/><text x="874" y="146" font-size="14.5" font-weight="700" fill="#FFFFFF">2. Escala Web Analítica (Ratio 1.20 · Comprador Internacional · 300 lux)</text><text x="874" y="208" font-size="32" font-weight="800" fill="#0F172A">Certificado de Origen FNC</text><text x="1474" y="204" class="mono" font-size="12.5" font-weight="700" fill="#135E34">H1 32 px / 800</text><line x1="874" y1="226" x2="1622" y2="226" stroke="#E2E8F0"/><text x="874" y="264" font-size="24" font-weight="700" fill="#0F172A">Historial de Trazabilidad y Secado</text><text x="1474" y="262" class="mono" font-size="12.5" font-weight="700" fill="#135E34">H2 24 px / 700</text><line x1="874" y1="282" x2="1622" y2="282" stroke="#E2E8F0"/><text x="874" y="318" font-size="16" font-weight="400" fill="#334155">Lectura continua de reportes técnicos, catación SCA y fechas.</text><text x="1474" y="316" class="mono" font-size="12.5" font-weight="700" fill="#135E34">Body 16 px / 400</text><line x1="874" y1="336" x2="1622" y2="336" stroke="#E2E8F0"/><text x="874" y="370" class="mono" font-size="18" font-weight="700" fill="#135E34">SACO-2026-CAU-7F3A9C12</text><text x="1474" y="368" class="mono" font-size="12.5" font-weight="700" fill="#135E34">Fira Code Mono</text><line x1="874" y1="388" x2="1622" y2="388" stroke="#E2E8F0"/><text x="874" y="420" font-size="12.5" fill="#64748B">Notas legales y aviso de privacidad Ley 1581 de 2012 (mín. 12 px)</text><text x="1474" y="420" class="mono" font-size="12.5" font-weight="700" fill="#135E34">Legal 12 px / 400</text><rect x="874" y="454" width="748" height="80" rx="8" fill="#ECFDF5" stroke="#135E34" stroke-width="1.5"/><text x="892" y="482" font-size="13" font-weight="800" fill="#135E34">CERO LICENCIAS Y CERO DESCARGAS REMOTAS:</text><text x="892" y="506" font-size="12.5" fill="#14532D">Pila nativa (Segoe UI / Roboto / SF Pro) + Fira Code local para distinguir 0/O y 1/I en códigos HMAC.</text></g>
<g filter="url(#card-sh)"><rect x="36" y="584" width="790" height="340" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="56" y="616" font-size="15" font-weight="800" fill="#0F172A">3. Sistema Modular de Espaciado (Base 8 pt / Submódulo 4 pt)</text>
<text x="56" y="656" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">4 px</text><rect x="116" y="640" width="28" height="22" rx="4" fill="#94A3B8"/><text x="156" y="656" font-size="12.5" fill="#334155">Micro-alineación ícono-texto</text>
<text x="56" y="694" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">8 px</text><rect x="116" y="678" width="56" height="22" rx="4" fill="#64748B"/><text x="184" y="694" font-size="12.5" fill="#334155">Separación interna de badges</text>
<text x="56" y="732" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">12 px</text><rect x="116" y="716" width="84" height="22" rx="4" fill="#9E1B1B"/><text x="212" y="732" font-size="12.5" fill="#334155">Guarda táctil obligatoria entre botones (evita error)</text>
<text x="56" y="770" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">16 px</text><rect x="116" y="754" width="112" height="22" rx="4" fill="#0F4C81"/><text x="240" y="770" font-size="12.5" fill="#334155">Padding estándar de tarjetas</text>
<text x="56" y="808" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">24 px</text><rect x="116" y="792" width="168" height="22" rx="4" fill="#0F4C81"/><text x="296" y="808" font-size="12.5" fill="#334155">Margen entre bloques de pantalla</text>
<text x="56" y="846" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">48 px</text><rect x="116" y="830" width="240" height="22" rx="4" fill="#135E34"/><text x="368" y="846" font-size="12.5" fill="#334155">Botón primario estándar (web y oficina)</text>
<text x="56" y="884" class="mono" font-size="12.5" font-weight="700" fill="#0F172A">56 px</text><rect x="116" y="868" width="280" height="22" rx="4" fill="#135E34"/><text x="408" y="884" font-size="12.5" fill="#334155">Botón vehicular / campo (dedos con guantes)</text>
</g>
