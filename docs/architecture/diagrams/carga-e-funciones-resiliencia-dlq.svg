<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 980" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #232F3E; text-anchor: middle; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #5A6B7C; text-anchor: middle; }
      .swimlane-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #232F3E; }
      .card-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #232F3E; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #555555; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #232F3E; }
      .code-body { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #232F3E; }
      .flow-line { stroke: #545B64; stroke-width: 2; fill: none; }
      .flow-line-accent { stroke: #1D76DB; stroke-width: 2.5; fill: none; }
      .flow-line-danger { stroke: #D93F0B; stroke-width: 2.5; fill: none; }
      .flow-line-success { stroke: #0E8A16; stroke-width: 2.5; fill: none; }
      .flow-line-warning { stroke: #FF9900; stroke-width: 2.5; fill: none; }
      .flow-dashed { stroke-dasharray: 6,4; }
    </style>
    <filter id="box-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#545B64" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D93F0B" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E8A16" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D76DB" />
    </marker>
    <marker id="arrow-warning" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900" />
    </marker>
  </defs>

  <!-- FONDO -->
  <rect width="1650" height="980" fill="#FFFFFF" />

  <!-- ENCABEZADO -->
  <text x="825" y="38" class="main-title">AromaPacífico - Ciclo de Vida de Resiliencia, Reintentos Exponenciales y Aislamiento de Fallas (DLQ)</text>
  <text x="825" y="62" class="sub-title">Garantía de Cero Mutación Destructiva, Preservación de Evidencias en S3 y Procedimiento de Redrive Operativo</text>

  <!-- ==================== CONTENEDOR 1: EJECUCION Y REINTENTOS ==================== -->
  <g transform="translate(30, 95)">
    <rect width="470" height="850" rx="8" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="2" />
    <rect x="0" y="0" width="470" height="35" rx="8" fill="#EAEDED" />
    <text x="15" y="23" class="swimlane-title">CICLO DE EJECUCIÓN Y REINTENTOS (LAMBDA)</text>

    <!-- INVOCACION -->
    <g transform="translate(20, 50)">
      <rect width="430" height="110" rx="6" fill="#F0F7FF" stroke="#1D76DB" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Invocación Asíncrona por Evento</text>
      <text x="15" y="45" class="card-sub">Eventos S3 (ObjectCreated) o Lotes IoT / SQS</text>
      <text x="15" y="68" class="card-body">• Lambda recibe el puntero al objeto en S3 (Bucket y Key)</text>
      <text x="15" y="88" class="card-body">• Runtime asigna un RequestID y traza en AWS X-Ray</text>
    </g>

    <!-- INTENTO 1 -->
    <g transform="translate(20, 185)">
      <rect width="430" height="150" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Intento 1: Ejecución Nominal de la Función</text>
      <text x="15" y="45" class="card-sub">Procesamiento Serverless en Subred Privada VPC</text>
      <text x="15" y="70" class="card-body">• Lectura de imagen en S3 e invocación a Rekognition</text>
      <text x="15" y="90" class="card-body">• SI OCURRE ERROR (Timeout, Throttling 503, Error de red):</text>
      <text x="25" y="110" class="card-body">- Se aborta la ejecución antes de escribir en DynamoDB</text>
      <text x="25" y="130" class="card-sub" fill="#D93F0B">- El archivo original en S3 permanece 100% intacto</text>
    </g>

    <!-- INTENTO 2 -->
    <g transform="translate(20, 360)">
      <rect width="430" height="140" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Intento 2: Reintento Exponencial con Jitter</text>
      <text x="15" y="45" class="card-sub">Backoff Automático Administrado (Runtime Lambda)</text>
      <text x="15" y="70" class="card-body">• Ventana de espera: ~1 a 3 segundos con jitter aleatorio</text>
      <text x="15" y="90" class="card-body">• Previene saturación sincronizada de endpoints AWS</text>
      <text x="15" y="110" class="card-body">• Si el servicio se recupera: completa y finaliza en éxito</text>
      <text x="15" y="130" class="card-body">• Si la excepción persiste: escala al último reintento</text>
    </g>

    <!-- INTENTO 3 -->
    <g transform="translate(20, 525)">
      <rect width="430" height="140" rx="6" fill="#FFF5F5" stroke="#D93F0B" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Intento 3: Reintento Final de Agotamiento</text>
      <text x="15" y="45" class="card-sub">Segundo Reintento Asíncrono (t = 4 a 8 s)</text>
      <text x="15" y="70" class="card-body">• Última oportunidad de ejecución automática</text>
      <text x="15" y="90" class="card-body">• Si falla nuevamente: AGOTAMIENTO FORMAL (RetriesExhausted)</text>
      <text x="15" y="110" class="card-body">• Se activa el destino de fallos asíncrono (OnFailure Destination)</text>
      <text x="15" y="130" class="card-sub" fill="#D93F0B">• No hay reintentos infinitos que eleven la factura</text>
    </g>

    <!-- DESPACHO DLQ -->
    <g transform="translate(20, 690)">
      <rect width="430" height="135" rx="6" fill="#FFF5F5" stroke="#D93F0B" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Despacho Automático a Dead Letter Queue (DLQ)</text>
      <text x="15" y="45" class="card-sub">Destino SQS Dedicado sin Impactar Flujos Productivos</text>
      <text x="15" y="70" class="card-body">• Enrutamiento directo mediante AWS Lambda Destinations</text>
      <text x="15" y="90" class="card-body">• Payload original enriquecido con stack trace y causa de error</text>
      <text x="15" y="110" class="card-body">• Se aísla el mensaje fallido para remediación controlada</text>
    </g>
  </g>

  <!-- ==================== CONTENEDOR 2: DLQ Y RECARGA ==================== -->
  <g transform="translate(530, 95)">
    <rect width="550" height="850" rx="8" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="2" />
    <rect x="0" y="0" width="550" height="35" rx="8" fill="#EAEDED" />
    <text x="15" y="23" class="swimlane-title">COLA DE FALLOS (DEAD LETTER QUEUE) Y CARGA ENRIQUECIDA</text>

    <!-- PAYLOAD EN DLQ -->
    <g transform="translate(20, 50)">
      <rect width="510" height="420" rx="6" fill="#FFF5F5" stroke="#D93F0B" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Amazon SQS: dlq-confirmacion-foco (Cifrado KMS)</text>
      <text x="15" y="45" class="card-sub">Retención Máxima: 14 días (1.209.600 s) · Dead-Letter Queue Dedicada</text>
      <text x="15" y="70" class="code-body">{</text>
      <text x="25" y="88" class="code-body">"version": "1.0",</text>
      <text x="25" y="106" class="code-body">"timestamp": "2026-11-08T15:02:00Z",</text>
      <text x="25" y="124" class="code-body">"requestContext": {</text>
      <text x="35" y="142" class="code-body">"requestId": "c8b3e1a0-9412-4f32-8b01-fnc2026",</text>
      <text x="35" y="160" class="code-body">"functionArn": "arn:aws:lambda:us-east-1:...:ProcessFocusConfirmation",</text>
      <text x="35" y="178" class="code-body">"condition": "RetriesExhausted",</text>
      <text x="35" y="196" class="code-body">"approximateInvokeCount": 3</text>
      <text x="25" y="214" class="code-body">},</text>
      <text x="25" y="232" class="code-body">"requestPayload": {</text>
      <text x="35" y="250" class="code-body">"Records": [ {</text>
      <text x="45" y="268" class="code-body">"s3": {</text>
      <text x="55" y="286" class="code-body">"bucket": { "name": "aromapacifico-objetos-prod" },</text>
      <text x="55" y="304" class="code-body">"object": { "key": "raw-images/focos/FINCA-CAUCA-012/foto_9412.jpg" }</text>
      <text x="45" y="322" class="code-body">} } ]</text>
      <text x="25" y="340" class="code-body">},</text>
      <text x="25" y="358" class="code-body">"responsePayload": {</text>
      <text x="35" y="376" class="code-body">"errorMessage": "ServiceUnavailable: Rekognition rate exceeded",</text>
      <text x="35" y="394" class="code-body">"errorType": "ProvisionedThroughputExceededException"</text>
      <text x="25" y="412" class="code-body">}</text>
      <text x="15" y="430" class="code-body">}</text>
    </g>

    <!-- REDRIVE -->
    <g transform="translate(20, 500)">
      <rect width="510" height="175" rx="6" fill="#F0F7FF" stroke="#1D76DB" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Protocolo de Remediación: SQS DLQ Redrive</text>
      <text x="15" y="45" class="card-sub">Recuperación Controlada sin Desplazamientos a Campo</text>
      <text x="15" y="70" class="card-body">1. El equipo SRE recibe alerta P1 de CloudWatch</text>
      <text x="15" y="90" class="card-body">2. Se subsana la causa raíz (ej. aumento de cuota en Rekognition)</text>
      <text x="15" y="110" class="card-body">3. Se ejecuta redrive desde la consola o CLI hacia la función Lambda</text>
      <text x="15" y="130" class="card-body">4. Lambda reprocesa el mensaje exactamente con la misma imagen S3</text>
      <text x="15" y="150" class="card-sub" fill="#1D76DB">BENEFICIO OPERATIVO: CERO NECESIDAD DE REPETIR EL VUELO DEL DRON</text>
    </g>

    <!-- RETENCION Y PURGA -->
    <g transform="translate(20, 700)">
      <rect width="510" height="125" rx="6" fill="#FFFFFF" stroke="#545B64" stroke-width="1.5" />
      <text x="15" y="25" class="card-header">Garantía de Retención y Auditoría Permanente</text>
      <text x="15" y="48" class="card-body">• Si tras 14 días no se ejecuta redrive, el mensaje pasa a archivo histórico</text>
      <text x="15" y="68" class="card-body">• S3 Object Lock retiene las fotos por 5 años independientemente de fallos</text>
      <text x="15" y="88" class="card-body">• Cero pérdida de trazabilidad en auditorías ante la FNC o el ICA</text>
    </g>
  </g>

  <!-- ==================== CONTENEDOR 3: INVARIANTES Y SRE ==================== -->
  <g transform="translate(1110, 95)">
    <rect width="510" height="850" rx="8" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="2" />
    <rect x="0" y="0" width="510" height="35" rx="8" fill="#EAEDED" />
    <text x="15" y="23" class="swimlane-title">GARANTÍAS ARQUITECTÓNICAS Y OBSERVABILIDAD SRE</text>

    <!-- INVARIANTES -->
    <g transform="translate(20, 50)">
      <rect width="470" height="280" rx="6" fill="#F4FBF5" stroke="#0E8A16" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Invariantes Innegociables de Plataforma</text>
      <text x="15" y="55" class="card-header" fill="#0E8A16">1. PRESERVACIÓN DEL OBJETO DE ORIGEN</text>
      <text x="15" y="75" class="card-body">La imagen o archivo en S3 permanece 100% intacto. Ninguna</text>
      <text x="15" y="95" class="card-body">falla de red, timeout o excepción en inferencia altera el archivo.</text>

      <text x="15" y="125" class="card-header" fill="#0E8A16">2. CERO MUTACIÓN DE ESTADO EN FALLA</text>
      <text x="15" y="145" class="card-body">La tabla ExpedienteFitosanitario en DynamoDB NO muta.</text>
      <text x="15" y="165" class="card-body">El foco permanece en estado previo (EN_EVALUACION). Se impide</text>
      <text x="15" y="185" class="card-body">que una falla técnica descarte una plaga o cierre un caso.</text>

      <text x="15" y="215" class="card-header" fill="#0E8A16">3. PREVENCIÓN DE FALSAS FUMIGACIONES</text>
      <text x="15" y="235" class="card-body">Sin un registro exitoso y sin la firma posterior de un agrónomo</text>
      <text x="15" y="255" class="card-body">con MFA, NUNCA se emite una orden de aspersión química.</text>
    </g>

    <!-- ALARMAS CLOUDWATCH -->
    <g transform="translate(20, 350)">
      <rect width="470" height="250" rx="6" fill="#FFF8E1" stroke="#FF9900" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">Amazon CloudWatch: Monitoreo y Alarmas P1</text>
      <text x="15" y="45" class="card-sub">Detección Inmediata de Mensajes en Colas DLQ</text>
      <text x="15" y="70" class="card-body">• Métrica: ApproximateNumberOfMessagesVisible &gt; 0 en DLQ</text>
      <text x="15" y="90" class="card-body">• Periodo de evaluación: 1 minuto (1 punto de datos)</text>
      <text x="15" y="110" class="card-body">• Notificación crítica por Amazon SNS a ingenieros de guardia</text>
      <text x="15" y="130" class="card-body">• Métricas por función:</text>
      <text x="25" y="150" class="code-body">Errors, Invocations, Duration, Throttles, ConcurrentExecutions</text>
      <text x="15" y="172" class="card-body">• Dashboards con desglose por FincaID, DronID y AcopioID</text>
      <text x="15" y="195" class="card-sub" fill="#FF9900">TIEMPO DE RESPUESTA OPERACIONAL (MTTR): &lt; 30 MINUTOS</text>
      <text x="15" y="215" class="card-body">Detección y contención sin degradar la recepción de sacos</text>
    </g>

    <!-- TRAZABILIDAD X-RAY -->
    <g transform="translate(20, 620)">
      <rect width="470" height="205" rx="6" fill="#F0F7FF" stroke="#1D76DB" stroke-width="2" filter="url(#box-shadow)" />
      <text x="15" y="25" class="card-header">AWS X-Ray y CloudWatch Logs Insights</text>
      <text x="15" y="45" class="card-sub">Auditoría Criptográfica e Inmutabilidad (5 Años)</text>
      <text x="15" y="70" class="card-body">• Logs estructurados en JSON con RequestID, ETag y duración</text>
      <text x="15" y="90" class="card-body">• Encriptación KMS y almacenamiento en cuenta Security</text>
      <text x="15" y="110" class="card-body">• S3 Object Lock en modo Compliance impide eliminación</text>
      <text x="15" y="130" class="card-body">• Cumplimiento estricto de auditoría forense para la FNC</text>
      <text x="15" y="155" class="card-sub" fill="#1D76DB">RETENCIÓN REGULATORIA EXIGIDA: 5 AÑOS (1.825 DÍAS)</text>
    </g>
  </g>

  <!-- LÍNEAS DE CONEXIÓN ENTRE PASOS -->
  <path d="M 235 160 L 235 185" class="flow-line" marker-end="url(#arrow)" />
  <path d="M 235 335 L 235 360" class="flow-line-warning" marker-end="url(#arrow-warning)" />
  <path d="M 235 500 L 235 525" class="flow-line-danger" marker-end="url(#arrow-danger)" />
  <path d="M 235 665 L 235 690" class="flow-line-danger" marker-end="url(#arrow-danger)" />

  <path d="M 450 755 L 550 755 L 550 260 L 570 260" class="flow-line-danger" marker-end="url(#arrow-danger)" />
  <path d="M 1040 260 L 1130 260" class="flow-line-success" marker-end="url(#arrow-success)" />
  <path d="M 1040 400 L 1130 400" class="flow-line-warning" marker-end="url(#arrow-warning)" />
  <path d="M 800 500 L 800 470" class="flow-line-accent flow-dashed" marker-end="url(#arrow-accent)" />

</svg>
