<g transform="translate(28,17) scale(0.56)"><circle cx="50" cy="50" r="46" fill="#0A3D20" stroke="#4ADE80" stroke-width="2.5"/><path d="M 47.5,14 C 29,14 17,29 17,50 C 17,71 29,86 47.5,86 C 42,72 43,60 46.5,50 C 50,40 51,28 47.5,14 Z" fill="#FFFFFF"/><path d="M 52.5,14 C 56,28 55,40 51.5,47 C 64,45 76,40 81,30 C 78,19 68,14 52.5,14 Z" fill="#86EFAC"/><path d="M 51.5,53 C 48,60 47,72 52.5,86 C 68,86 83,73 83,52 C 75,51 63,52 51.5,53 Z" fill="#E2E8F0"/></g>
<text x="98" y="30" font-size="12" font-weight="700" fill="#86EFAC" letter-spacing="1.2">LÁMINA 1 DE 3 · APP DEL CAFICULTOR</text>
<text x="98" y="55" font-size="22" font-weight="800" fill="#FFFFFF">Aplicación Móvil del Caficultor (Campo Abierto y Beneficiadero)</text>
<text x="98" y="77" font-size="13" font-weight="400" fill="#D1FAE5">Diseñada para lectura bajo sol directo, operación con guantes y sincronización store-and-forward de 24 horas</text>
<rect x="1325" y="30" width="127" height="30" rx="15" fill="#135E34" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1388" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Botones 56 px</text>
<rect x="1165" y="30" width="150" height="30" rx="15" fill="#B45309" stroke="#FFFFFF" stroke-opacity="0.28"/><text x="1240" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Sol &gt; 80.000 lux</text>
<g transform="translate(48,134)" filter="url(#card-sh)"><rect x="0" y="0" width="410" height="680" rx="34" fill="#0F172A"/><rect x="10" y="10" width="390" height="660" rx="26" fill="#FAF8F5"/><rect x="10" y="10" width="390" height="66" rx="26" fill="#135E34"/><rect x="10" y="48" width="390" height="28" fill="#135E34"/><text x="30" y="34" font-size="12" font-weight="700" fill="#86EFAC">06:15 AM · MODO SOL AAA</text><text x="30" y="60" font-size="16" font-weight="800" fill="#FFFFFF">Finca Las Brisas · Cauca</text><rect x="26" y="92" width="358" height="114" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.2"/><rect x="26" y="92" width="7" height="114" rx="3" fill="#B91C1C"/><text x="46" y="118" font-size="13.5" font-weight="800" fill="#7F1D1D">ALERTA: FOCO DE ROYA CONFIRMADO</text><text x="46" y="142" font-size="12.5" fill="#7F1D1D">Lote 3 (Caturra) · Severidad Alta (87 %)</text><text x="46" y="164" font-size="12" fill="#9E1B1B">Esperando aprobación MFA del Agrónomo</text><rect x="46" y="176" width="166" height="22" rx="11" fill="#9E1B1B"/><text x="129" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Alerta en 245 s</text><rect x="26" y="220" width="358" height="56" rx="8" fill="#9E1B1B"/><text x="205" y="254" text-anchor="middle" font-size="15.5" font-weight="800" fill="#FFFFFF">VER RECOMENDACIÓN TÉCNICA</text><text x="26" y="306" font-size="12.5" font-weight="800" fill="#0F172A">REGISTRO DE BÁSCULA (BENEFICIADERO)</text><rect x="26" y="318" width="172" height="84" rx="10" fill="#FFFFFF" stroke="#135E34" stroke-width="1.8"/><text x="42" y="342" font-size="12" font-weight="700" fill="#475569">PESO DEL SACO</text><text x="42" y="382" class="mono" font-size="28" font-weight="800" fill="#0F172A">60.0 kg</text><rect x="212" y="318" width="172" height="84" rx="10" fill="#FFFFFF" stroke="#135E34" stroke-width="1.8"/><text x="228" y="342" font-size="12" font-weight="700" fill="#475569">HUMEDAD FNC</text><text x="228" y="382" class="mono" font-size="28" font-weight="800" fill="#135E34">11.8 %</text><rect x="26" y="420" width="358" height="56" rx="8" fill="#135E34"/><text x="205" y="454" text-anchor="middle" font-size="15.5" font-weight="800" fill="#FFFFFF">REGISTRAR PESAJE DE SACO</text><rect x="26" y="492" width="358" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="42" y="518" font-size="12.5" font-weight="800" fill="#78350F">SIN SEÑAL · BUFFER FLASH 24 H ACTIVO</text><text x="42" y="540" font-size="12" fill="#78350F">Se borra solo al recibir ACK de AWS IoT Core</text><rect x="26" y="570" width="358" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="42" y="596" font-size="12.5" font-weight="800" fill="#0F172A">RESUMEN DEL DÍA</text><rect x="42" y="608" width="160" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><g transform="translate(48,614) scale(0.667)"><circle cx="12" cy="12" r="4" fill="none" stroke="#B45309" stroke-width="2.3"/><path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.9 4.9L7.1 7.1M16.9 16.9L19.1 19.1M19.1 4.9L16.9 7.1M7.1 16.9L4.9 19.1" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/></g><text x="70" y="627" font-size="12" font-weight="800" fill="#78350F">4 PREPARACIÓN</text><rect x="212" y="608" width="156" height="28" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/><g transform="translate(218,614) scale(0.667)"><path d="M12 2L4 5.5V11.5C4 16.8 7.5 21 12 22.5C16.5 21 20 16.8 20 11.5V5.5Z" fill="#16A34A"/><path d="M8.5 12.2L10.8 14.6L15.8 9.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="240" y="627" font-size="12" font-weight="800" fill="#14532D">1 ACEPTADO</text></g>
<g filter="url(#card-sh)"><rect x="508" y="134" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#135E34" stroke-width="1.8"/><rect x="508" y="134" width="8" height="120" rx="4" fill="#135E34"/><rect x="532" y="150" width="160" height="24" rx="12" fill="#135E34"/><text x="542" y="166" font-size="12" font-weight="700" fill="#FFFFFF">SOL &gt; 80.000 LUX</text><text x="532" y="202" font-size="16" font-weight="800" fill="#0F172A">Contraste Bioclimático AAA (&gt; 7:1)</text><text x="532" y="228" font-size="13.5" fill="#334155">Lienzo pergamino #FAF8F5 y tipografía Carbón #0F172A (17.85:1) para lectura sin reflejo en cafetal.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="274" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#9E1B1B" stroke-width="1.8"/><rect x="508" y="274" width="8" height="120" rx="4" fill="#9E1B1B"/><rect x="532" y="290" width="177" height="24" rx="12" fill="#9E1B1B"/><text x="542" y="306" font-size="12" font-weight="700" fill="#FFFFFF">ERGONOMÍA DE CAMPO</text><text x="532" y="342" font-size="16" font-weight="800" fill="#0F172A">Botones de 56 px y Simplicidad Radical</text><text x="532" y="368" font-size="13.5" fill="#334155">Cero menús hamburguesa complejos; máximo 2 acciones primarias utilizables con guantes de lona o lluvia.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="414" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/><rect x="508" y="414" width="8" height="120" rx="4" fill="#B45309"/><rect x="532" y="430" width="177" height="24" rx="12" fill="#B45309"/><text x="542" y="446" font-size="12" font-weight="700" fill="#FFFFFF">OFFLINE-FIRST 24 H</text><text x="532" y="482" font-size="16" font-weight="800" fill="#0F172A">Buffer Flash Local + Acuse ACK</text><text x="532" y="508" font-size="13.5" fill="#334155">El pesaje de sacos (60 kg) y humedad se guardan localmente y solo se depuran tras confirmación de AWS.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="554" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#0F4C81" stroke-width="1.8"/><rect x="508" y="554" width="8" height="120" rx="4" fill="#0F4C81"/><rect x="532" y="570" width="144" height="24" rx="12" fill="#0F4C81"/><text x="542" y="586" font-size="12" font-weight="700" fill="#FFFFFF">ADOPCIÓN RURAL</text><text x="532" y="622" font-size="16" font-weight="800" fill="#0F172A">Sustitución Amigable del Cuaderno</text><text x="532" y="648" font-size="13.5" fill="#334155">Pocas pantallas claras con alertas fitosanitarias (&lt; 245 s) y resumen diario de sacos en preparación.</text></g>
<g filter="url(#card-sh)"><rect x="508" y="694" width="924" height="120" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/><rect x="508" y="694" width="8" height="120" rx="4" fill="#0F172A"/><rect x="532" y="710" width="169" height="24" rx="12" fill="#0F172A"/><text x="542" y="726" font-size="12" font-weight="700" fill="#FFFFFF">SEGURIDAD COGNITO</text><text x="532" y="762" font-size="16" font-weight="800" fill="#0F172A">Identidad Aislada por Caficultor</text><text x="532" y="788" font-size="13.5" fill="#334155">Acceso por Amazon Cognito (USD 0/mes) limitado estrictamente a sus propias fincas y lotes.</text></g>
</svg>